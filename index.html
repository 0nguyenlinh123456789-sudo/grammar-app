<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/bunny_logo.png" />
    <!-- ⚠️ iOS BỎ QUA HOÀN TOÀN `icons` trong manifest khi "Thêm vào MH chính"
         — nó CHỈ đọc thẻ này. Trỏ vào ảnh 256px cũ nghĩa là mọi icon PWA khai
         trong manifest KHÔNG áp dụng trên iPhone, đúng chiếc máy mà chủ web sẽ
         thử đầu tiên. 180×180 là cỡ iOS dùng; sinh bằng `npm run tao:icon`. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- ⚠️ `viewport-fit=cover` KHÔNG PHẢI TRANG TRÍ: thiếu nó thì MỌI
         `env(safe-area-inset-*)` trong CSS đều trả về 0 trên iPhone. Nghĩa là
         `pb-[env(safe-area-inset-bottom)]` của BottomTabBar và phần đệm của
         huy hiệu quyền truy cập đều là mơ — thanh điều hướng nằm dưới vạch
         Home của iPhone, bấm không trúng. Lỗi này im lặng tuyệt đối trên máy
         tính bàn, nên có một phép kiểm ghim đúng dòng dưới đây. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#facc15" />
    <!-- Dark mode is class-based (.dark on <html>, toggled in App.jsx), so the
         document must declare "light" here. Advertising "light dark" made the
         browser paint default text white on dark-mode systems while the app
         still drew light backgrounds — invisible text on the access screens. -->
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Bunny English - Luyện Ngữ Pháp & Từ Vựng Tiếng Anh Siêu Cấp</title>
    <meta name="description" content="Bunny English - Cùng thỏ Bunny luyện Ngữ Pháp & Từ Vựng Tiếng Anh theo phương pháp Gamification (Duolingo-style) và trí tuệ nhân tạo Gemini AI." />
    
    <!-- ══ THẺ CHIA SẺ (Open Graph + Twitter) ══
         Ở Việt Nam kênh miễn phí thật là link dán vào nhóm Zalo/Facebook, không
         phải SEO: web này là MỘT url, không router, không dựng sẵn phía máy chủ,
         nên Google gần như không có gì để xếp hạng. Thứ quyết định người ta có
         bấm hay không là cái thẻ hiện ra khi dán link — và trước 19/08 ở đây
         KHÔNG có thẻ nào, nên link chia sẻ hiện ra là một url trần.

         og:image PHẢI là URL tuyệt đối — Zalo và Facebook không giải được đường
         dẫn tương đối. Dùng ảnh có sẵn trong public/ để không phát sinh phụ thuộc.
         Đổi tên miền thì phải sửa hai dòng og:url và og:image ở đây. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bunny English" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:url" content="https://grammar-app-gray.vercel.app/" />
    <meta property="og:title" content="Bunny English — Học tiếng Anh từ mất gốc đến B2, có lộ trình rõ ràng" />
    <meta property="og:description" content="724 chặng từ A0 đến B2 kèm nhánh C1: ngữ pháp, từ vựng có phiên âm IPA, 269 bài đọc song ngữ, trò chơi ôn tập và trợ lý AI. Học trên điện thoại hay máy tính đều được." />
    <meta property="og:image" content="https://grammar-app-gray.vercel.app/bunny_studying.png" />
    <meta property="og:image:alt" content="Thỏ Bunny ngồi học tiếng Anh bên bàn" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bunny English — Học tiếng Anh từ mất gốc đến B2" />
    <meta name="twitter:description" content="724 chặng A0 → B2, bài đọc song ngữ, trò chơi ôn tập và trợ lý AI. Học trên điện thoại hay máy tính." />
    <meta name="twitter:image" content="https://grammar-app-gray.vercel.app/bunny_studying.png" />

    <!-- Fonts (Outfit & Inter) are self-hosted in /fonts and declared via
         src/fonts.css — no external font CDN. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
