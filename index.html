<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/bunny_logo.png" />
    <link rel="apple-touch-icon" href="/bunny_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#facc15" />
    <!-- Dark mode is class-based (.dark on <html>, toggled in App.jsx), so the
         document must declare "light" here. Advertising "light dark" made the
         browser paint default text white on dark-mode systems while the app
         still drew light backgrounds — invisible text on the access screens. -->
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Bunny English - Luyện Ngữ Pháp & Từ Vựng Tiếng Anh Siêu Cấp</title>
    <meta name="description" content="Bunny English - Cùng thỏ Bunny luyện Ngữ Pháp & Từ Vựng Tiếng Anh theo phương pháp Gamification (Duolingo-style) và trí tuệ nhân tạo Gemini AI." />
    
    <!-- Google Fonts: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
